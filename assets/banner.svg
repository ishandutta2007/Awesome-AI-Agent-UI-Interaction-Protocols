<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b16" />
      <stop offset="50%" stop-color="#0e1026" />
      <stop offset="100%" stop-color="#05060b" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="orb-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#67e8f9" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- UI Card Glass Gradient -->
    <linearGradient id="glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
  </defs>

  <style>
    .font-heavy { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .font-medium { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    /* Animated background pulses */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.65; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1.1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(0.9) translate(-20px, 15px); opacity: 0.6; }
    }
    @keyframes streamData {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillRev {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes pulseNode {
      0%, 100% { r: 5px; opacity: 0.7; }
      50% { r: 8px; opacity: 1; }
    }

    .orb-1 { animation: pulseOrb 10s ease-in-out infinite; transform-origin: 220px 110px; }
    .orb-2 { animation: pulseOrb2 12s ease-in-out infinite; transform-origin: 1060px 290px; }
    .flow-stream { stroke-dasharray: 8 8; animation: streamData 3s linear infinite; }
    .float-1 { animation: floatPill 6s ease-in-out infinite; }
    .float-2 { animation: floatPillRev 7s ease-in-out infinite; }
    .float-3 { animation: floatPill 5s ease-in-out infinite 1s; }
    .pulse-dot { animation: pulseNode 3s ease-in-out infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#cyber-grid)" />

  <!-- Dynamic Animated Glowing Orbs in Background -->
  <circle class="orb-1" cx="220" cy="110" r="280" fill="url(#orb-violet)" />
  <circle class="orb-2" cx="1060" cy="290" r="320" fill="url(#orb-cyan)" />
  <circle cx="640" cy="380" r="260" fill="url(#orb-pink)" opacity="0.3" />

  <!-- Dynamic Network Connection Streams (Flow Lines) in Background -->
  <g opacity="0.45">
    <path class="flow-stream" d="M 100 80 Q 300 20 500 90 T 900 60 T 1200 120" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-stream" d="M 80 360 Q 380 410 650 350 T 1000 390 T 1220 320" fill="none" stroke="#c084fc" stroke-width="2" />
    <path class="flow-stream" d="M 200 420 C 400 300 800 440 1100 340" fill="none" stroke="#06b6d4" stroke-width="1.5" />
  </g>

  <!-- Decorative Protocol Graph Nodes (Left Side Dynamic Element) -->
  <g class="float-1" opacity="0.65">
    <line x1="80" y1="180" x2="160" y2="130" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <line x1="160" y1="130" x2="190" y2="220" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <circle cx="80" cy="180" r="4" fill="#38bdf8" />
    <circle cx="160" cy="130" r="6" fill="#a855f7" class="pulse-dot" />
    <circle cx="190" cy="220" r="4" fill="#f43f5e" />
  </g>

  <!-- Decorative Protocol Graph Nodes (Right Side Dynamic Element) -->
  <g class="float-2" opacity="0.65">
    <line x1="1120" y1="140" x2="1190" y2="200" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <line x1="1190" y1="200" x2="1100" y2="260" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <circle cx="1120" cy="140" r="5" fill="#22d3ee" />
    <circle cx="1190" cy="200" r="7" fill="#ec4899" class="pulse-dot" />
    <circle cx="1100" cy="260" r="4" fill="#818cf8" />
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Ecosystem Badges) -->
  <!-- Top Category Pill Badge -->
  <g transform="translate(640, 68)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
    <circle cx="-135" cy="0" r="4.5" fill="#38bdf8" class="pulse-dot" />
    <text x="0" y="5" text-anchor="middle" class="font-medium font-mono" font-size="13" fill="#38bdf8" letter-spacing="1.5">THE NEXT-GEN AGENT FRONTEND STACK</text>
  </g>

  <!-- Main Hero Title (Foreground) -->
  <text x="640" y="148" text-anchor="middle" class="font-heavy" font-size="44" fill="url(#title-grad)" letter-spacing="-0.5">
    Awesome AI Agent UI &amp; Interaction Protocols
  </text>

  <!-- Subtitle (Foreground) -->
  <text x="640" y="194" text-anchor="middle" class="font-medium" font-size="18" fill="#94a3b8" letter-spacing="0.2">
    The Definitive Landscape for AG-UI, A2UI, MCP-UI, Generative UI SDKs &amp; Agent Workspaces
  </text>

  <!-- Dynamic Feature Badges / Protocol Cards Row (Foreground Floats) -->
  <!-- Pill 1: AG-UI -->
  <g class="float-1" transform="translate(210, 260)">
    <rect x="-85" y="-22" width="170" height="44" rx="12" fill="url(#glass-card)" stroke="rgba(139, 92, 246, 0.45)" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" class="font-heavy font-mono" font-size="14" fill="#c084fc">⚡ AG-UI Protocol</text>
  </g>

  <!-- Pill 2: Generative UI -->
  <g class="float-3" transform="translate(425, 260)">
    <rect x="-95" y="-22" width="190" height="44" rx="12" fill="url(#glass-card)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" class="font-heavy font-mono" font-size="14" fill="#38bdf8">🎨 Generative UI (GenUI)</text>
  </g>

  <!-- Pill 3: MCP-UI -->
  <g class="float-2" transform="translate(640, 260)">
    <rect x="-85" y="-22" width="170" height="44" rx="12" fill="url(#glass-card)" stroke="rgba(236, 72, 153, 0.45)" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" class="font-heavy font-mono" font-size="14" fill="#f472b6">🔌 MCP-UI Apps</text>
  </g>

  <!-- Pill 4: Human-in-the-Loop -->
  <g class="float-1" transform="translate(855, 260)">
    <rect x="-95" y="-22" width="190" height="44" rx="12" fill="url(#glass-card)" stroke="rgba(34, 197, 94, 0.45)" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" class="font-heavy font-mono" font-size="14" fill="#4ade80">🛡️ Human-in-the-Loop</text>
  </g>

  <!-- Pill 5: A2UI Spec -->
  <g class="float-3" transform="translate(1070, 260)">
    <rect x="-85" y="-22" width="170" height="44" rx="12" fill="url(#glass-card)" stroke="rgba(251, 146, 60, 0.45)" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" class="font-heavy font-mono" font-size="14" fill="#fb923c">📑 A2UI Spec</text>
  </g>

  <!-- Bottom Tagline / Metric Bar -->
  <g transform="translate(640, 360)">
    <rect x="-430" y="-24" width="860" height="48" rx="24" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="0" y="6" text-anchor="middle" class="font-medium" font-size="13" fill="#cbd5e1">
      🚀 Curated SaaS Platforms • 🌐 Open-Source Wire Protocols • 📦 Streaming Chat SDKs • 🖥️ Self-Hosted Agent Workspaces
    </text>
  </g>
</svg>
